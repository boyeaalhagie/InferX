# Experiment E — Precision Study
# Research question: What are the performance + memory + accuracy tradeoffs of quantization?
# This is NOT simply "INT8 is faster." We measure all three dimensions.

experiment: E_precision
engine: tensorrt_llm    # TRT-LLM has the best quantization support
input_tokens: 512
output_tokens: 256
batch_size: 4
requests: 50
warmup: 3

sweep:
  dtype: [fp16, bf16, int8]
  # fp32 likely too slow / may not be supported on H100 at scale

accuracy_eval:
  enabled: true
  dataset: workloads/eval_set.json   # 50 questions — see evaluation/
  metrics: [output_similarity, perplexity]
  reference_dtype: bf16              # compare all others against this
